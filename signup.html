<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ARN'S ARENA - Signup</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#020826;
    }

    .container{
      width:470px;
      background:#1d223b;
      border-radius:28px;
      padding:50px 55px;
      text-align:center;
      box-shadow: 0 0 25px rgba(0, 132, 255, 0.15);
    }

    .logo{
      font-size:52px;
      margin-bottom:10px;
    }

    h1{
      color:white;
      font-size:32px;
      margin-bottom:35px;
      font-weight:800;
      letter-spacing:1px;
    }

    h2{
      color:white;
      font-size:22px;
      margin-bottom:35px;
    }

    .input-box{
      margin-bottom:26px;
    }

    .input-box input{
      width:100%;
      padding:18px;
      border:none;
      outline:none;
      border-radius:14px;
      font-size:15px;
      background:#f1f1f1;
    }

    .input-box input:focus{
      box-shadow: 0 0 10px #00bfff;
    }

    .signup-btn{
      width:100%;
      padding:17px;
      border:none;
      border-radius:16px;
      font-size:18px;
      font-weight:bold;
      color:white;
      cursor:pointer;
      margin-top:8px;
      background:linear-gradient(90deg,#18c5f4,#0b78ff);
      box-shadow:
      0 0 12px rgba(0,191,255,0.7),
      0 0 20px rgba(255,0,100,0.35);
      transition:0.3s;
    }

    .signup-btn:hover{
      transform:scale(1.03);
      box-shadow:
      0 0 18px rgba(0,191,255,1),
      0 0 30px rgba(255,0,100,0.55);
    }

    .bottom-text{
      color:white;
      margin-top:28px;
      font-size:16px;
    }

    .login-btn{
      display:inline-block;
      margin-top:20px;
      padding:14px 26px;
      border-radius:14px;
      background:linear-gradient(90deg,#ff512f,#ff3d77);
      color:white;
      text-decoration:none;
      font-weight:bold;
      box-shadow: 0 0 12px rgba(255,72,72,0.7);
      transition:0.3s;
    }

    .login-btn:hover{
      transform:scale(1.05);
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="logo">🔥</div>
    <h1>ARN'S ARENA</h1>
    <h2>✨ Create Account</h2>

    <div class="input-box">
      <input id="signupUser" type="text" placeholder="Enter Username">
    </div>

    <div class="input-box">
      <input id="signupPass" type="password" placeholder="Enter Password">
    </div>

    <button class="signup-btn" onclick="signupUser()">
      Create Account 🚀
    </button>

    <div class="bottom-text">
      Already have an account?
    </div>

    <a href="login.html" class="login-btn">
      Login 🔐
    </a>
  </div>

  <script src="script.js"></script>

</body>
</html>
